doctrine:
    dbal:
        driver: 'pdo_mysql'
        host: '%env(resolve:DB_HOST)%'
        port: '%env(resolve:DB_PORT)%'
        dbname: '%env(resolve:DB_DATABASE)%'
        user: '%env(resolve:DB_USERNAME)%'
        password: '%env(resolve:DB_PASSWORD)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '%env(resolve:SERVER_VERSION)%'

        # only needed for MySQL
        charset: utf8mb4
        default_table_options:
            collate: utf8mb4_unicode_ci

        # Enable savepoints for nested transactions
        use_savepoints: true

        # Native SQL logging configuration
        logging: true
        profiling: '%kernel.debug%'

        # backtrace queries in profiler (increases memory usage per request)
        #profiling_collect_backtrace: '%kernel.debug%'
    orm:
        auto_generate_proxy_classes: true

        # Fix naming strategy deprecation by setting numberAware to true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: annotation
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
